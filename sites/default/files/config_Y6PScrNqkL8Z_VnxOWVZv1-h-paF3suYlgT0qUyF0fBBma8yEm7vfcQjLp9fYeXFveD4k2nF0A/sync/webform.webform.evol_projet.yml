id: evol_projet
title: 'Evol projet'
description: 'Evolution on projet'
categories:
  - proto
elements: |-
  name_:
    '#type': textfield
    '#title': 'Name *'
    '#prepopulate': true
    '#required': true
    '#required_error': 'This field is required'
    '#default_value': CAT_RTGen
  is_active_:
    '#type': checkbox
    '#title': 'Is active'
    '#disabled': true
    '#prepopulate': true
    '#required': true
    '#required_error': 'This field '
    '#states':
      invisible:
        ':input[name="name_"]':
          filled: true
    '#default_value': true
  rule_versioning:
    '#type': checkbox
    '#title': 'Rule Versioning'
    '#disabled': true
    '#prepopulate': true
    '#required': true
    '#required_error': 'This field is required'
    '#states':
      invisible:
        ':input[name="name_"]':
          filled: true
  da_hub_notification:
    '#type': checkbox
    '#title': 'DQ Hub Notification'
    '#disabled': true
    '#prepopulate': true
    '#required': true
    '#required_error': 'This field is required'
    '#states':
      invisible:
        ':input[name="name_"]':
          filled: true
  parents:
    '#type': tableselect
    '#title': Parents
    '#options':
      PROJET1: PROJET1
      PROJET2: PROJET2
    '#states':
      invisible:
        ':input[name="name_"]':
          filled: true
  rule_public_sharing:
    '#type': webform_section
    '#title': 'Rule public sharing'
    project_level_public_sharing:
      '#type': checkbox
      '#title': 'Project level public sharing'
      '#states':
        visible:
          '':
            '': ''
    select_entity_level_public_sharing:
      '#type': checkbox
      '#title': 'Select Entity Level  public sharing'
      '#states':
        invisible:
          ':input[name="project_level_public_sharing"]':
            checked: true
    entity_public_sharing:
      '#type': webform_entity_checkboxes
      '#title': 'Entity level public sharing'
      '#options_all': true
      '#states':
        visible:
          ':input[name="select_entity_level_public_sharing"]':
            checked: true
          ':input[name="project_level_public_sharing"]':
            unchecked: true
      '#target_type': node
      '#selection_handler': 'default:node'
      '#selection_settings':
        target_bundles:
          department: department
        sort:
          field: body.value
          direction: ASC
    select_user_level_public_sharing:
      '#type': checkbox
      '#title': 'Select user level  public sharing'
      '#states':
        invisible:
          - ':input[name="project_level_public_sharing"]':
              checked: true
          - xor
          - ':input[name="select_entity_level_public_sharing"]':
              checked: true
    user_level_public_sharing:
      '#type': webform_entity_checkboxes
      '#title': 'User level public sharing'
      '#options_all': true
      '#states':
        visible:
          ':input[name="project_level_public_sharing"]':
            unchecked: true
          ':input[name="select_entity_level_public_sharing"]':
            unchecked: true
          ':input[name="select_user_level_public_sharing"]':
            checked: true
      '#target_type': node
      '#selection_handler': views
      '#selection_settings':
        view:
          view_name: list_of_users_by_department
          display_name: entity_reference_1
          arguments: {  }
    select_rule_level_public_sharing:
      '#type': checkbox
      '#title': 'Select rule level  public sharing'
      '#states':
        invisible:
          - ':input[name="project_level_public_sharing"]':
              checked: true
          - xor
          - ':input[name="select_entity_level_public_sharing"]':
              checked: true
          - xor
          - ':input[name="select_user_level_public_sharing"]':
              checked: true
    rules_level_public_sharing:
      '#type': webform_entity_checkboxes
      '#title': 'Rules level public sharing'
      '#options_all': true
      '#states':
        visible:
          ':input[name="project_level_public_sharing"]':
            unchecked: true
          ':input[name="select_entity_level_public_sharing"]':
            unchecked: true
          ':input[name="select_user_level_public_sharing"]':
            unchecked: true
          ':input[name="select_rule_level_public_sharing"]':
            checked: true
      '#target_type': node
      '#selection_handler': views
      '#selection_settings':
        view:
          view_name: list_of_rules_by_users
          display_name: entity_reference_1
          arguments: {  }
    select_scope_of_target_project:
      '#type': checkbox
      '#title': 'Select Scope of target Project'
      '#states':
        visible:
          '':
            '': ''
    scope_of_target_projects:
      '#type': checkboxes
      '#title': 'Scope of target projects'
      '#options':
        PROJ1: PROJ1
        PROJ2: PROJ2
        PROJ3: PROJ3
      '#states':
        visible:
          ':input[name="select_scope_of_target_project"]':
            checked: true
