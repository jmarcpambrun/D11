id: donnees_en_entree
title: 'Données en entrée'
description: '<p>Données en entrée&nbsp;</p>'
categories:
  - proto
elements: |-
  nom_de_la_table:
    '#type': textfield
    '#title': 'Nom de la table'
    '#prepopulate': true
    '#required': true
    '#required_error': 'Champs obligatoire'
    '#unique': true
    '#unique_entity': true
    '#unique_error': 'Le nom de la table est unique'
  description:
    '#type': textfield
    '#title': Description
    '#required': true
  chemin:
    '#type': textarea
    '#title': Chemin
    '#required': true
    '#required_error': 'Champs obligatoire'
  format:
    '#type': select
    '#title': Format
    '#prepopulate': true
    '#options':
      PARQUET: PARQUET
      ORC: ORC
      AVRO: AVRO
      CSV: CSV
      JSON: JSON
      XML: XML
    '#sort_options': true
    '#required': true
    '#required_error': 'Le type de format de fichiers de données est obligatoire'
  validation_de_schema:
    '#type': checkbox
    '#title': 'Validation de schema'
    '#description': '<p>Spécifie si le(s) fichier(s) de données doit être validé par le schéma attendu pour cette table</p>'
    '#return_value': 'false'
  optionnel:
    '#type': checkbox
    '#title': Optionnel
    '#description': '<p>Spécifie si le fichier des données est obligatoire ou optionnel</p>'
    '#return_value': 'false'
  delimiteur:
    '#type': textarea
    '#title': Délimiteur
    '#states':
      visible:
        ':input[name="format"]':
          value: CSV
    '#default_value': ;
  entete:
    '#type': checkbox
    '#title': Entête
    '#states':
      visible:
        ':input[name="format"]':
          value: CSV
  root_tag:
    '#type': textfield
    '#title': 'Root Tag'
    '#description': '<p>Spécifie dans le cas de fichier au format xml quel est le tag racine</p>'
    '#pattern': '<\S+>'
    '#pattern_error': 'Le motif ne correspond pas à un tag XML'
    '#states':
      visible:
        ':input[name="format"]':
          value: XML
    '#default_value': '<root-tag>'
  row_tag:
    '#type': textfield
    '#title': 'Row Tag'
    '#description': '<p>Spécifie dans le cas de fichier au format xml quel est le tag racine</p>'
    '#pattern': '<\S+>'
    '#pattern_error': 'Le motif ne correspond pas à un tag XML'
    '#states':
      visible:
        ':input[name="format"]':
          value: XML
    '#default_value': '<row-tag>'
  muti_line:
    '#type': checkbox
    '#title': 'Muti line'
    '#description': '<p>Spécifie si le fichier json contient un enregistrement sur plusieurs ligne ou sur une seule</p>'
    '#states':
      visible:
        ':input[name="format"]':
          value: JSON
    '#return_value': 'false'
  catalogue_id:
    '#type': number
    '#title': 'Catalogue Id'
    '#description': '<p>Id dans le catalogue du dataset</p>'
  trigramme:
    '#type': textfield
    '#title': Trigramme
    '#description': "<p>Trigramme permettant d'identifier le data set en particulier dans DQHUB</p>"
  build_entity:
    '#type': textfield
    '#title': _build_entity
    '#states':
      invisible-slide:
        ':input[name="build_entity"]':
          filled: true
    '#states_clear': false
    '#default_value': qure_inputs
  entity_id:
    '#type': textfield
    '#title': _entity_id
    '#states':
      invisible-slide:
        ':input[name="entity_id"]':
          filled: true
    '#states_clear': false
    '#default_value': '[random:number]'
