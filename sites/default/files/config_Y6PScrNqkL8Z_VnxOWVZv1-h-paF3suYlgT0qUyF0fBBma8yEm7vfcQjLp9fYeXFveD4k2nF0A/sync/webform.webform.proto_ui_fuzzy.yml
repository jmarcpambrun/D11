id: proto_ui_fuzzy
title: proto_ui_fuzzy
description: 'Permet de faire un prototypage pour la saisie de r&egrave;gle de fuzzy matching'
categories:
  - proto
elements: |-
  action_panem:
    '#type': webform_wizard_page
    '#title': ACTION_SCREEN
    '#open': true
    action:
      '#type': select
      '#title': Action
      '#prepopulate': true
      '#options':
        FUZZY_MATCHING: FUZZY_MATCHING
        WARNING: WARNING
      '#sort_options': true
    attribute_name:
      '#type': textfield
      '#title': Attribute_name
      '#placeholder': 'The Attribute Name'
      '#autocomplete': 'off'
      '#required': true
      '#required_error': 'The attribute name is required'
    associated_input_table_name:
      '#type': select
      '#title': 'Associated input table-name'
      '#prepopulate': true
      '#options':
        order: order
        customer: customer
        demo_shipping: demo_shipping
      '#sort_options': true
      '#required': true
      '#required_error': 'The Associated input table-name'
    fuzzy_matching_parameters:
      '#type': webform_section
      '#title': 'Fuzzy_matching parameters'
      '#required': true
      '#states':
        visible:
          ':input[name="action"]':
            value: FUZZY_MATCHING
      case_sensitive:
        '#type': select
        '#title': 'Case sensitive'
        '#prepopulate': true
        '#options':
          'True': 'True'
          'False': 'False'
        '#options_display': side_by_side
        '#other__option_label': ''
        '#other__placeholder': ''
        '#required': true
        '#required_error': Required
      input_source:
        '#type': select
        '#title': input-source
        '#options':
          order: order
          customer: customer
          demo_shipping: demo_shipping
        '#empty_value': '{{Attribute_name}}'
        '#required': true
      container:
        '#type': container
        array_algo:
          '#type': webform_table
          '#title': array_algo
          '#title_display': none
          '#required': true
          '#required_error': Required
          '#header':
            - title: Algoritm
              attributes: {  }
          alogoritms:
            '#type': webform_section
            '#title': Algoritms
            '#required': true
            '#format': container
            algoritm_name:
              '#type': select
              '#title': Algoritm-name
              '#options':
                Levenshtein: Levenshtein
                Damerau-Levenshtein: Damerau-Levenshtein
                Hamming: Hamming
                NGrams: NGrams
              '#required': true
              '#required_error': 'An algoritm-name should be choosen'
            token_number:
              '#type': number
              '#title': Token-number
              '#states':
                visible:
                  ':input[name="algoritm_name"]':
                    value: NGrams
            matchning_score:
              '#type': number
              '#title': Matching-score
              '#required': true
              '#min': 1
              '#max': 10
            matching_type:
              '#type': select
              '#title': Matching-type
              '#prepopulate': true
              '#options':
                row: row
                column: column
              '#required': true
            source:
              '#type': webform_section
              '#title': Source
              '#required': true
              '#states':
                visible:
                  ':input[name="matching_type"]':
                    filled: true
              keys:
                '#type': textarea
                '#title': keys
                '#description_display': invisible
                '#maxlength': 8000
                '#placeholder': 'List of columns of source data separated by a a coma'
                '#required': true
                '#required_error': Required
                '#multiple__min_items': 1
                '#format': custom
                '#format_text': '{{ data.composite_element_key.subelement_key }}'
                '#format_items': semicolon
              selected_columns:
                '#type': textarea
                '#title': 'selected columns'
                '#maxlength': 8000
                '#placeholder': ' '
                '#multiple__min_items': 0
                '#format': custom
                '#format_text': '{{ item.value }}'
                '#format_items': semicolon
              partitions:
                '#type': textarea
                '#title': Partitions
                '#description_display': invisible
                '#maxlength': 8000
                '#placeholder': ' '
                '#multiple__min_items': 0
                '#format': custom
                '#format_text': '{{ item.value }}'
                '#format_items': semicolon
            referential:
              '#type': webform_section
              '#title': Referential
              '#states':
                visible:
                  ':input[name="matching_type"]':
                    value: column
              table:
                '#type': select
                '#title': table
                '#options':
                  order: order
                  customer: customer
                  demo_shipping: demo_shipping
                '#required': true
              scope:
                '#type': textarea
                '#title': Scope
                '#description_display': invisible
                '#maxlength': 8000
              keys_ref:
                '#type': textarea
                '#title': 'keys ref'
                '#maxlength': 8000
                '#required': true
                '#multiple__min_items': 0
                '#format': custom
                '#format_text': '{{ item.value }}'
                '#format_items': semicolon
              selected_columns_ref:
                '#type': textarea
                '#title': 'selected columns ref'
                '#maxlength': 8000
                '#format': custom
                '#format_text': '{{ item.value }}'
                '#format_items': semicolon
            windowing:
              '#type': fieldset
              '#title': windowing
              '#title_display': invisible
              '#description_display': invisible
              '#required': true
              enable_windowing:
                '#type': checkbox
                '#title': enable_windowing
                '#states':
                  unchecked:
                    '':
                      '': ''
              window8size:
                '#type': number
                '#title': window_size
                '#size': '2'
                '#required': true
                '#states':
                  visible:
                    ':input[name="enable_windowing"]':
                      checked: true
                  invisible:
                    ':input[name="enable_windowing"]':
                      unchecked: true
                '#min': 1
                '#max': 10
              order_by:
                '#type': textarea
                '#title': order_by
                '#required': true
                '#states':
                  visible:
                    ':input[name="enable_windowing"]':
                      checked: true
                  invisible:
                    ':input[name="enable_windowing"]':
                      unchecked: true
            valider:
              '#type': 'webform_options_custom:buttons'
              '#title': Valider
              '#options': yes_no
              '#required': true
              '#required_error': Required
              '#states':
                enabled:
                  ':input[name="array_algo"]':
                    filled: true
    actions:
      '#type': webform_actions
      '#title': 'Bouton(s) d''envoi'
      '#states':
        visible:
          '':
            '': ''
