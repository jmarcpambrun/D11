title: 'Add new Drupal site'
elements: |-
  owner:
    '#type': entity_autocomplete
    '#title': Owner
    '#required': true
    '#target_type': user
    '#selection_handler': 'default:user'
    '#selection_settings':
      include_anonymous: true
      filter:
        type: role
        role:
          customer: customer
          administrator: 0
      sort:
        field: name
        direction: ASC
  host:
    '#type': webform_entity_select
    '#title': Host
    '#required': true
    '#target_type': drd_host
    '#selection_handler': 'default:drd_host'
    '#selection_settings':
      sort:
        field: name
        direction: ASC
  url:
    '#type': textfield
    '#title': Url
    '#disabled': true
    '#required': true
    '#default_value': 'https://core[webform_submission:values:core_id].bison.bitegra-solutions.de'
  site_name:
    '#type': textfield
    '#title': 'Site name'
    '#required': true
  template:
    '#type': select
    '#title': Template
    '#options':
      lakedrops/d8-project: 'Default Drupal 8'
    '#required': true
  core_id:
    '#type': number
    '#title': 'Core ID'
    '#access_create_roles': {  }
  gitlab_project:
    '#type': textfield
    '#title': 'GitLab Project'
    '#access_create_roles': {  }
  gitlab_url:
    '#type': textfield
    '#title': 'GitLab URL'
    '#access_create_roles': {  }
handlers:
  drd_core_installer:
    label: 'Save DRD core and domain'
  remote_post:
    label: 'Deploy new Drupal site'
  create_project:
    label: 'Create GitLab project'
