langcode: fr
status: true
dependencies: {  }
id: content_language
label: 'Content translation'
routes:
  -
    route_name: language.content_settings_page
tips:
  content_translation_settings:
    id: content_translation_settings
    plugin: text
    label: 'Content Translation'
    weight: 1
    position: auto
    selector: null
    body: 'In this page you can specify the content pieces of the website that may be translated, and default languages for them.'
  content_translation_setting_entity_types:
    id: content_translation_setting_entity_types
    plugin: text
    label: 'Content Translation Settings'
    weight: 2
    position: auto
    selector: '#edit-entity-types'
    body: '<em>Content Entities</em> are configured here for translation. <em>Content Entities</em> typically are entities such as content types or taxonomies that may contain fields.<br>Check <em>Content</em> and click the <em>Next</em> button.'
  content_translation_content_settings:
    id: content_translation_content_settings
    plugin: text
    label: 'Content Type Settings'
    weight: 3
    position: right
    selector: '#edit-settings-node .bundle-settings'
    body: 'Individual Content Types may be configured for translation.<br>Check the first content to be translatable and click the <em>Next</em> button.'
  content_translation_article_settings:
    id: content_translation_article_settings
    plugin: text
    label: 'Field Settings'
    weight: 4
    position: right
    selector: '#edit-settings-node .field-settings'
    body: 'The individual fields of a content entity may be separately configured.<br>Even sub-field components (for example Alt and Title of an Image Field) can be individually configured.  Components which do not need to be translated, such as the Image File, can be left unchecked.'
