services:

  webform_entity_builder.entity_build:
    class: Drupal\webform_entity_builder\EventSubscriber\EntityBuildEventSubscriber
    arguments: ['@logger.factory',
                '@entity_type.manager',
                '@plugin.manager.entity_builder']
    tags:
    - { name: event_subscriber }

  plugin.manager.entity_builder:
    class: Drupal\webform_entity_builder\Plugin\EntityBuilderManager
    parent: default_plugin_manager
