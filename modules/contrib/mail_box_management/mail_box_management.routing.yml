mail_box_management.configuration:
  path: '/mailbox-management/configuration'
  defaults:
    _controller: '\Drupal\mail_box_management\Controller\MailboxManagement::configuration'
    _title: 'Mail Box Management Configurations'
  requirements:
    _role: administrator+mail_account_owner
  options:
    _admin_route: TRUE

