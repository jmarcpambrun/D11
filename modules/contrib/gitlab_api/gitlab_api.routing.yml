entity.gitlab_server.collection:
  path: '/admin/config/services/gitlab-server'
  defaults:
    _entity_list: 'gitlab_server'
    _title: 'Gitlab Servers'
  requirements:
    _permission: 'administer gitlab_server'

entity.gitlab_server.add_form:
  path: '/admin/config/services/gitlab-server/add'
  defaults:
    _entity_form: 'gitlab_server.add'
    _title: 'Add a gitlab server'
  requirements:
    _permission: 'administer gitlab_server'

entity.gitlab_server.edit_form:
  path: '/admin/config/services/gitlab-server/{gitlab_server}'
  defaults:
    _entity_form: 'gitlab_server.edit'
    _title: 'Edit a gitlab server'
  requirements:
    _permission: 'administer gitlab_server'

entity.gitlab_server.delete_form:
  path: '/admin/config/services/gitlab-server/{gitlab_server}/delete'
  defaults:
    _entity_form: 'gitlab_server.delete'
    _title: 'Delete a gitlab server'
  requirements:
    _permission: 'administer gitlab_server'

gitlab_api.webhook:
  path: '/gitlab-api/webhook/{project}'
  defaults:
    _controller: '\Drupal\gitlab_api\Controller\WebhookController::receive'
  methods: [POST]
  requirements:
    # Public, unauthenticated endpoint — GitLab posts directly without a
    # session. The controller authenticates each request via the
    # X-Gitlab-Token header (per-project shared secret).
    _access: 'TRUE'
    project: '[a-z0-9_]+'
  options:
    no_cache: TRUE
