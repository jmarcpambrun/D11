upgrade_status_test_error.page:
  path: '/upgrade-status-test-error'
  defaults:
    _controller: '\Drupal\upgrade_status_test_error\Controller\UpgradeStatusTestErrorController::content'
  requirements:
    _permission: 'access content'
  options:
    # Upgrade Status reports the deprecated route name in this value.
    upgrade_status_test_previous_route: upgrade_status_test_routes_provider.old
