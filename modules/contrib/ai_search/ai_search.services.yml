services:
  ai_search.embedding_strategy:
    class: Drupal\ai_search\EmbeddingStrategyPluginManager
    parent: default_plugin_manager
  ai_search.event_subscriber.solr_boost_by_ai_search:
    class: Drupal\ai_search\EventSubscriber\SolrBoostByAiSearchEventSubscriber
    tags:
      - { name: event_subscriber }
  ai_search.event_subscriber.new_server:
    class: Drupal\ai_search\EventSubscriber\NewServerEventSubscriber
    tags:
      - { name: event_subscriber }
    arguments: ['@ai.vdb_provider']
  ai_search.event_subscriber.chunk_tracking_reset:
    class: Drupal\ai_search\EventSubscriber\ChunkTrackingResetEventSubscriber
    tags:
      - { name: event_subscriber }
    arguments: ['@database']
  ai_search.event_subscriber.function_call_definitions:
    class: Drupal\ai_search\EventSubscriber\FunctionCallDefinitionsEventSubscriber
    tags:
      - { name: event_subscriber }
    arguments: ['@plugin.manager.ai.function_calls']
  ai_search.results_cache_variation:
    class: Drupal\ai_search\ResultsCacheVariation
    arguments: ['@config.factory', '@current_user']
