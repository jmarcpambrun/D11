  defaults:
    _controller: '\Drupal\burndown\Controller\TaskController::addToWatchlist'
    ticket_id: ''
    user_id: ''
  methods:  [GET]
  requirements:
    _custom_access: '\Drupal\burndown\Controller\TaskController::checkTaskEditAccess'

burndown.task_remove_from_watchlist:
  path: '/burndown/api/task/remove_from_watchlist/{ticket_id}/{user_id}'
  defaults:
    _controller: '\Drupal\burndown\Controller\TaskController::removeFromWatchlist'
    ticket_id: ''
    user_id: ''
  methods:  [GET]
  requirements:
    _custom_access: '\Drupal\burndown\Controller\TaskController::checkTaskEditAccess'

burndown.task_get_relationships:
  path: '/burndown/api/task/get_relationships/{ticket_id}'
  defaults:
    _controller: '\Drupal\burndown\Controller\TaskController::getRelationships'
    ticket_id: ''
  methods:  [GET]
  requirements:
    _custom_access: '\Drupal\burndown\Controller\TaskController::checkTaskEditAccess'
  options:
    no_cache: TRUE

burndown.task_add_relationship:
  path: '/burndown/api/task/add_relationship'
  defaults:
    _controller: '\Drupal\burndown\Controller\TaskController::addRelationship'
  methods:  [POST]
  requirements:
    _custom_access: '\Drupal\burndown\Controller\TaskController::checkTaskEditAccess'

burndown.task_remove_relationship:
  path: '/burndown/api/task/remove_relationship/{from_ticket_id}/{to_ticket_id}'
  defaults:
    _controller: '\Drupal\burndown\Controller\TaskController::removeRelationship'
    from_ticket_id: ''
    to_ticket_id: ''
  methods:  [GET]
  requirements:
    _custom_access: '\Drupal\burndown\Controller\TaskController::checkTaskEditAccess'

burndown.task_add_multi_bundle:
  path: '/burndown/task_add_multi_bundle/{shortcode}'
  defaults:
    _controller: '\Drupal\burndown\Controller\TaskController::addBundleSelect'
    shortcode: ''
  methods:  [GET]
  requirements:
    _custom_access: '\Drupal\burndown\Controller\TaskController::checkTaskAddAccess'

burndown.task_add_redirect:
  path: '/burndown/add-task/{shortcode}'
  defaults:
