orchestration_agent: false
triage_agent: false
max_loops: 12
max_loops_message: 'I was not able to finish this ECA task within my allowed number of steps. Please describe the model in smaller steps or with more detail.'
default_information_tools: |
  eca_model_schema:
    label: 'The JSON Schema of an ECA model'
    description: 'The schema that the model you create has to comply with'
    tool: 'ai_integration_eca:get_model_schema'
    parameters: {  }
  eca_existing_models:
    label: 'The ECA models that already exist'
    description: 'A summary of every ECA model on this website. Their ids are taken, so do not reuse one of them for a new model.'
    tool: 'ai_integration_eca:list_models'
    parameters: {  }
  eca_available_components:
    label: 'The available events, conditions and actions'
    description: 'Every component that can be used as a building block in a model. Use eca_get_component_details to get the configuration options of the ones you pick.'
    tool: 'ai_integration_eca:list_components'
    parameters: {  }
