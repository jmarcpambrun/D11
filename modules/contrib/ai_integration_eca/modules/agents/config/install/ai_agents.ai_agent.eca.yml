    return_directly: 0
    require_usage: 0
    description_override: ''
    progress_message: 'Looking up the schema of an ECA model'
    use_artifacts: 0
  'ai_integration_eca:list_models':
    return_directly: 0
    require_usage: 0
    description_override: ''
    progress_message: 'Looking up the existing ECA models'
    use_artifacts: 0
  'ai_integration_eca:list_components':
